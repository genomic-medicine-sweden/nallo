# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "sawfish_sv"
description: Call structural variants and produce depth tracks using Sawfish
keywords:
  - sv calling
  - sawfish
  - long-read sequencing
  - joint calling
components:
  - sawfish/discover
  - sawfish/jointcall
input:
  - ch_bam_bai:
      type: file
      description: |
        Channel containing sample information (meta), BAM and BAI files
        Structure: [ val(meta), path(bam), path(bai) ]
      pattern: "*.{bam,cram}"
  - ch_snvs:
      type: file
      description: |
        Channel containing sample information (meta) and SNV VCF file (optional, for MAF track)
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
  - ch_fasta:
      type: file
      description: |
        Channel containing sample information (meta) and reference FASTA file
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fas,fasta}"
  - ch_expected_xy_bed:
      type: file
      description: |
        Channel containing sample information (meta) and expected copy-number BED for XY samples
        Structure: [ val(meta), path(bed) ]
      pattern: "*.bed"
  - ch_expected_xx_bed:
      type: file
      description: |
        Channel containing sample information (meta) and expected copy-number BED for XX samples
        Structure: [ val(meta), path(bed) ]
      pattern: "*.bed"
  - ch_exclude_bed:
      type: file
      description: |
        Channel containing sample information (meta) and regions to exclude (optional)
        Structure: [ val(meta), path(bed) ]
      pattern: "*.bed{,.gz}"
  - create_maf_track:
      type: boolean
      description: Whether to produce a MAF track (requires ch_snvs)
  - force_joint_call_single_samples:
      type: boolean
      description: Force joint calling even when only a single sample is present
output:
  - vcf:
      type: file
      description: |
        Channel containing sample information (meta, with sv_caller, needs_reheader, skip_vep_prep stamped)
        and VCF file
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
  - tbi:
      type: file
      description: |
        Channel containing sample information (meta) and VCF index file
        Structure: [ val(meta), path(tbi) ]
      pattern: "*.vcf.gz.tbi"
  - depth_bw:
      type: file
      description: |
        Channel containing sample information (meta) and depth bigWig file
        Structure: [ val(meta), path(bw) ]
      pattern: "*.bw"
  - copynum_bedgraph:
      type: file
      description: |
        Channel containing sample information (meta) and copy-number bedGraph file
        Structure: [ val(meta), path(bedgraph) ]
      pattern: "*.bedgraph"
  - gc_bias_corrected_depth_bw:
      type: file
      description: |
        Channel containing sample information (meta) and GC-bias-corrected depth bigWig file
        Structure: [ val(meta), path(bw) ]
      pattern: "*.bw"
  - maf_bw:
      type: file
      description: |
        Channel containing sample information (meta) and MAF bigWig file (optional)
        Structure: [ val(meta), path(bw) ]
      pattern: "*.bw"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@aksenia"
maintainers:
  - "@aksenia"
