name: nf-test matrix

on:
  workflow_call:
    inputs:
      tags:
        description: JSON array of test tags
        required: true
        type: string
      nextflow-version:
        description: Nextflow version to test
        required: true
        type: string
      is-main:
        description: Whether the pull request targets main or master
        required: true
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NFT_VER: "0.9.5"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity

jobs:
  nf-test:
    name: "${{ matrix.tag }} | ${{ matrix.profile }} | ${{ inputs.nextflow-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [docker, singularity]
        tag: ${{ fromJson(inputs.tags) }}
        isMain:
          - ${{ inputs.is-main }}
        exclude:
          - isMain: false
            profile: "singularity"
          - isMain: false
            tag: "samplesheet_target_regions_null"
        include:
          - tag: "samplesheet"
            runCleanup: true
          - tag: "samplesheet_multisample_bam"
            runCleanup: true
          - tag: "samplesheet_multisample_ont_bam"
            runCleanup: true
          - tag: "samplesheet_multisample_ont_bam_ont_r10_as"
            runCleanup: true
          - tag: "samplesheet_target_regions_null"
            runCleanup: true
          - tag: "call_svs"
            profile: "singularity"
            runCleanup: true
          - tag: "qc_snvs"
            profile: "singularity"
            runCleanup: true
          - tag: "call_snvs"
            profile: "singularity"
            runCleanup: true
          - tag: "annotate_cadd"
            profile: "singularity"
            runCleanup: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Clean up Disk space
        if: matrix.runCleanup
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Run nf-test
        if: matrix.profile != ''
        uses: ./.github/actions/nf-test
        env:
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
          NXF_VERSION: ${{ inputs.nextflow-version }}
        with:
          profile: ${{ matrix.profile }}
          tags: ${{ matrix.tag }}
          shard: 1
          total_shards: 1
