name: nf-test
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  release:
    types: [published]
  workflow_dispatch:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  find-tests:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.find.outputs.tags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: get subworkflows
        id: find
        uses: ./.github/actions/find-tests

      - name: debug
        run: |
          echo ${{ steps.find.outputs.tags }}

  nf-test:
    name: "nf-test | ${{ matrix.NXF_VER }}"
    needs: [find-tests]
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.10.3"
          - "latest-stable"
    # Each Nextflow version gets its own tag/profile matrix below the 256-job limit.
    uses: ./.github/workflows/nf-test-matrix.yml
    with:
      tags: ${{ needs.find-tests.outputs.tags }}
      nextflow-version: ${{ matrix.NXF_VER }}
      is-main: ${{ github.base_ref == 'master' || github.base_ref == 'main' }}
    secrets: inherit

  confirm-pass:
    needs: [nf-test]
    if: always()
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    steps:
      - name: One or more tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: One or more tests cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All tests ok
        if: ${{ contains(needs.*.result, 'success') }}
        run: exit 0

      - name: debug-print
        if: always()
        run: |
          echo "::group::DEBUG: `needs` Contents"
          echo "DEBUG: toJSON(needs) = ${{ toJSON(needs) }}"
          echo "DEBUG: toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
          echo "::endgroup::"
